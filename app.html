<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Фасон</title>
  <style>
    :root {
      --bg: #f6f4f1;
      --bg-alt: #ffffff;
      --ink: #111111;
      --muted: #5c5c5c;
      --line: #e4dfd8;
      --accent: #000000;
      --error: #8a1f1f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", Times, serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(246, 244, 241, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .brand,
    h1 {
      font-family: Impact, "Arial Black", "Segoe UI Black", sans-serif;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }

    .brand {
      font-size: 26px;
      text-decoration: none;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
    }

    nav a {
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    nav a:hover,
    .btn:hover,
    .btn-ghost:hover,
    .switch-link:hover {
      opacity: 0.72;
    }

    main {
      flex: 1;
      padding: 56px 0 72px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 72px);
      margin-bottom: 12px;
    }

    h2, h3 {
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    h2 {
      font-size: clamp(28px, 4vw, 36px);
      margin-bottom: 10px;
    }

    h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .lead {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--muted);
      max-width: 52ch;
    }

    .panel {
      margin-top: 32px;
      background: var(--bg-alt);
      border: 1px solid var(--line);
      padding: 28px;
      max-width: 520px;
    }

    .cabinet {
      margin-top: 32px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--bg-alt);
      border: 1px solid var(--line);
      padding: 24px;
    }

    label {
      display: block;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      color: var(--ink);
    }

    input:focus {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    .btn,
    .btn-ghost {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 22px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 0;
      cursor: pointer;
    }

    .btn {
      background: var(--accent);
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
      margin-left: 10px;
    }

    .switch {
      margin-top: 18px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: var(--muted);
    }

    .switch-link {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      color: var(--ink);
      text-decoration: underline;
      cursor: pointer;
    }

    .msg {
      margin-top: 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    .msg.error {
      color: var(--error);
    }

    .muted {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      color: #333;
    }

    .records {
      list-style: none;
      margin-top: 22px;
      display: grid;
      gap: 12px;
    }

    .record {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid var(--line);
      padding: 14px 16px;
    }

    .record p {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    .record small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
    }

    .record .btn {
      margin-top: 0;
      padding: 10px 14px;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 0 40px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .topbar-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .btn-ghost {
        margin-left: 0;
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html">Фасон</a>
      <nav>
        <a href="index.html#uslugi">Услуги</a>
        <a href="index.html#katalog">Каталог</a>
        <a href="index.html#kontakty">Контакты</a>
        <a href="app.html">Кабинет</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Кабинет</h1>
      <p class="lead">Войдите, чтобы смотреть свои записи. Регистрация — по почте и паролю.</p>

      <section id="auth" class="panel hidden">
        <form id="login-form">
          <h2>Вход</h2>
          <label for="login-email">Почта</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required>
          <label for="login-password">Пароль</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <button class="btn" type="submit">Войти</button>
          <p class="switch">
            Нет аккаунта?
            <button class="switch-link" type="button" data-show="register-form">Регистрация</button>
          </p>
        </form>

        <form id="register-form" class="hidden">
          <h2>Регистрация</h2>
          <label for="register-email">Почта</label>
          <input id="register-email" name="email" type="email" autocomplete="email" required>
          <label for="register-password">Пароль</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="6">
          <button class="btn" type="submit">Зарегистрироваться</button>
          <p class="switch">
            Уже есть аккаунт?
            <button class="switch-link" type="button" data-show="login-form">Вход</button>
          </p>
        </form>

        <p id="auth-msg" class="msg" hidden></p>
      </section>

      <section id="cabinet" class="cabinet hidden">
        <article class="card">
          <h2 id="welcome">Вы вошли</h2>
          <form id="logout-form">
            <button class="btn" type="submit">Выйти</button>
          </form>
        </article>
        <article class="card">
          <h3>Мои записи</h3>
          <form id="zapisi-form">
            <label for="zapisi-title">Что</label>
            <input id="zapisi-title" name="title" type="text" required>
            <label for="zapisi-data">Когда</label>
            <input id="zapisi-data" name="data" type="date" required>
            <button class="btn" type="submit">Добавить</button>
          </form>
          <p id="zapisi-msg" class="msg" hidden></p>
          <ul id="zapisi-list" class="records"></ul>
        </article>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">Фасон — мужские костюмы и пальто</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ypmrlyaimpsgnahhzxat.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_1laacUTH9OiLBRLCT2aJ_w_lfcJLCcH";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authSection = document.getElementById("auth");
    const cabinetSection = document.getElementById("cabinet");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const logoutForm = document.getElementById("logout-form");
    const welcome = document.getElementById("welcome");
    const authMsg = document.getElementById("auth-msg");
    const zapisiForm = document.getElementById("zapisi-form");
    const zapisiList = document.getElementById("zapisi-list");
    const zapisiMsg = document.getElementById("zapisi-msg");

    function showAuthMessage(text, isError) {
      authMsg.hidden = !text;
      authMsg.textContent = text || "";
      authMsg.classList.toggle("error", Boolean(isError && text));
    }

    function loginErrorText(error) {
      const code = (error && error.code) || "";
      const message = ((error && error.message) || "").toLowerCase();
      if (
        code === "invalid_credentials" ||
        message.includes("invalid login") ||
        message.includes("invalid credentials") ||
        message.includes("invalid email or password")
      ) {
        return "Неверная почта или пароль";
      }
      if (message.includes("email not confirmed")) {
        return "Подтвердите почту по ссылке из письма, затем войдите.";
      }
      return "Неверная почта или пароль";
    }

    function registerErrorText(error) {
      const message = ((error && error.message) || "").toLowerCase();
      if (message.includes("already registered") || message.includes("already been registered")) {
        return "Эта почта уже зарегистрирована. Войдите или укажите другую.";
      }
      if (message.includes("password")) {
        return "Пароль слишком короткий. Придумайте пароль не короче 6 символов.";
      }
      if (message.includes("email")) {
        return "Проверьте адрес почты — похоже, он указан неверно.";
      }
      return "Не получилось зарегистрироваться. Проверьте данные и попробуйте ещё раз.";
    }

    function showForm(id) {
      loginForm.classList.toggle("hidden", id !== "login-form");
      registerForm.classList.toggle("hidden", id !== "register-form");
      showAuthMessage("");
    }

    document.querySelectorAll("[data-show]").forEach(function (button) {
      button.addEventListener("click", function () {
        showForm(button.getAttribute("data-show"));
      });
    });

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      showAuthMessage("");
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const { error } = await client.auth.signInWithPassword({ email: email, password: password });
      if (error) {
        showAuthMessage(loginErrorText(error), true);
        return;
      }
      window.location.reload();
    });

    registerForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      showAuthMessage("");
      const email = document.getElementById("register-email").value.trim();
      const password = document.getElementById("register-password").value;
      const { data, error } = await client.auth.signUp({ email: email, password: password });
      if (error) {
        showAuthMessage(registerErrorText(error), true);
        return;
      }
      if (data.session) {
        window.location.reload();
        return;
      }
      showAuthMessage("Аккаунт создан. Если придёт письмо — подтвердите почту, затем войдите.");
    });

    logoutForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      await client.auth.signOut();
      window.location.reload();
    });

    function showZapisiMessage(text, isError) {
      zapisiMsg.hidden = !text;
      zapisiMsg.textContent = text || "";
      zapisiMsg.classList.toggle("error", Boolean(isError && text));
    }

    function zapisiErrorText(error, action) {
      const message = ((error && error.message) || "").toLowerCase();
      if (message.includes("row-level security") || message.includes("rls") || message.includes("permission")) {
        return "Нет доступа к записям. Войдите ещё раз или обратитесь к администратору.";
      }
      if (action === "load") {
        return "Не получилось загрузить записи. Обновите страницу и попробуйте снова.";
      }
      if (action === "add") {
        return "Не получилось добавить запись. Проверьте поля и попробуйте ещё раз.";
      }
      if (action === "delete") {
        return "Не получилось удалить запись. Попробуйте ещё раз.";
      }
      return "Что-то пошло не так с записями. Попробуйте ещё раз.";
    }

    function formatData(value) {
      if (!value) {
        return "";
      }
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (match) {
        return match[3] + "." + match[2] + "." + match[1];
      }
      return String(value);
    }

    function renderZapisi(rows) {
      zapisiList.innerHTML = "";
      if (!rows || rows.length === 0) {
        const empty = document.createElement("li");
        empty.className = "muted";
        empty.textContent = "Записей пока нет";
        zapisiList.appendChild(empty);
        return;
      }

      rows.forEach(function (row) {
        const item = document.createElement("li");
        item.className = "record";

        const text = document.createElement("div");
        const title = document.createElement("p");
        title.textContent = row.title || "Без названия";
        const when = document.createElement("small");
        when.textContent = formatData(row.data);
        text.appendChild(title);
        text.appendChild(when);

        const remove = document.createElement("button");
        remove.className = "btn";
        remove.type = "button";
        remove.textContent = "Удалить";
        remove.addEventListener("click", function () {
          deleteZapis(row.id);
        });

        item.appendChild(text);
        item.appendChild(remove);
        zapisiList.appendChild(item);
      });
    }

    async function loadZapisi() {
      const { data, error } = await client
        .from("zapisi")
        .select("id, title, data, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        showZapisiMessage(zapisiErrorText(error, "load"), true);
        zapisiList.innerHTML = "";
        return;
      }

      showZapisiMessage("");
      renderZapisi(data || []);
    }

    async function deleteZapis(id) {
      showZapisiMessage("");
      const { error } = await client.from("zapisi").delete().eq("id", id);
      if (error) {
        showZapisiMessage(zapisiErrorText(error, "delete"), true);
        return;
      }
      await loadZapisi();
    }

    zapisiForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      showZapisiMessage("");
      const title = document.getElementById("zapisi-title").value.trim();
      const data = document.getElementById("zapisi-data").value;
      const { error } = await client.from("zapisi").insert({ title: title, data: data });
      if (error) {
        showZapisiMessage(zapisiErrorText(error, "add"), true);
        return;
      }
      zapisiForm.reset();
      await loadZapisi();
    });

    client.auth.getSession().then(function (result) {
      const session = result.data && result.data.session;
      if (session && session.user) {
        welcome.textContent = "Вы вошли: " + (session.user.email || "");
        cabinetSection.classList.remove("hidden");
        loadZapisi();
      } else {
        authSection.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
